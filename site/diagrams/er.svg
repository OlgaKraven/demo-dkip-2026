<text x="855" y="712" font-family="Arial,sans-serif" font-size="17" fill="#263244">Дополнительные связи FK</text>
<text x="855" y="745" font-family="Arial,sans-serif" font-size="14" fill="#263244">Все ссылки на item и counterparty</text>
<text x="855" y="771" font-family="Arial,sans-serif" font-size="14" fill="#263244">подписаны внутри таблиц.</text>
<text x="855" y="805" font-family="Arial,sans-serif" font-size="14" fill="#263244">UNIQUE product_id: один продукт</text>
<text x="855" y="831" font-family="Arial,sans-serif" font-size="14" fill="#263244">имеет одну спецификацию.</text>
<text x="35" y="1210" font-family="Arial,sans-serif" font-size="16" fill="#263244">Расчёт стоимости — запрос по заказу, составу и цене на дату; вычисляемую сумму не дублируем в таблице.</text>
<text x="35" y="1238" font-family="Arial,sans-serif" font-size="15" fill="#263244">Единицы: одна базовая единица для каждой номенклатуры. output_qty — выход партии по спецификации.</text>
<text x="35" y="1264" font-family="Arial,sans-serif" font-size="14" fill="#263244">Учебная модель. SQL: examples/mysql/Sql/01-schema.sql или examples/postgresql/Sql/01-schema.sql.</text>
